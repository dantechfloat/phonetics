name: Checks

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: Commons files get renamed or deleted now and then.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  data:
    name: Validate data
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_data.js

  links:
    name: Check recording links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_links.js
